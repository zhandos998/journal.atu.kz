ServerTokens Prod
ServerSignature Off
ServerName journal.atu.kz
TraceEnable Off
FileETag None

RemoteIPHeader X-Forwarded-For
RemoteIPTrustedProxy 172.16.0.0/12
SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

<Directory /var/www/html>
	Options -Indexes +FollowSymLinks
	AllowOverride All
	Require all granted

	RewriteEngine On
	RewriteCond %{REQUEST_FILENAME} !-f
	RewriteCond %{REQUEST_FILENAME} !-d
	RewriteRule ^(.*)$ index.php/$1 [QSA,L]
</Directory>

<Directory /var/www/html/cache>
	Require all denied
</Directory>

<Directory /var/www/html/public>
	Options -Indexes
	php_admin_flag engine Off
	<FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|shtml)$">
		Require all denied
	</FilesMatch>
</Directory>

<FilesMatch "(?i)(^\.|config\.inc\.php$|composer\.(json|lock)$|package(-lock)?\.json$|yarn\.lock$|readme(\.md)?$|license$|changelog(\.md)?$|.*\.(sql|bak|old|orig|swp|dist)$)">
	Require all denied
</FilesMatch>

<DirectoryMatch "^/var/www/html/(\.git|\.github|docs|tests|tools|dbscripts|registry|node_modules)(/|$)">
	Require all denied
</DirectoryMatch>
