server {
    listen 80;
    listen [::]:80;
    server_name journal.atu.kz www.journal.atu.kz;

    return 301 https://journal.atu.kz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name journal.atu.kz www.journal.atu.kz;

    ssl_certificate /etc/ssl/atussl/ssl-bundle.crt;
    ssl_certificate_key /etc/ssl/atussl/atu.key;
    ssl_prefer_server_ciphers on;

    client_max_body_size 160m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }

    location ^~ /phpmyadmin/ {
        auth_basic "journal phpMyAdmin";
        auth_basic_user_file /etc/nginx/.htpasswd-journal-phpmyadmin;

        proxy_pass http://127.0.0.1:8121/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Forwarded-Prefix /phpmyadmin;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }

    location = /index.php {
        return 301 /;
    }

    location ~ ^/index\.php/(.*)$ {
        return 301 /$1$is_args$args;
    }

    location ~* (^|/)\. {
        return 403;
    }

    location ~* ^/(tools|dbscripts|registry|docs|tests|node_modules|\.git|\.github)(/|$) {
        return 403;
    }

    location ^~ /cache/ {
        return 403;
    }

    location ^~ /files/ {
        return 403;
    }

    location ^~ /ojs-files/ {
        return 403;
    }

    location ~* ^/(?!index\.php$).*\.(php[0-9]?|phtml|phar|cgi|pl|py|sh|shtml)$ {
        return 403;
    }

    location ~* ^/(readme(\.md)?|license|changelog(\.md)?)$ {
        return 403;
    }

    location ~* /(config\.inc\.php|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|.*\.(sql|bak|old|orig|swp|dist))$ {
        return 403;
    }

    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}
